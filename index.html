<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azharr | Creative Developer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- PHASE 1: MOBILE FRIENDLY PORTFOLIO --- */
        #portfolio-page {
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .hero h1 {
            font-size: 1.8rem; /* Ukuran pas buat HP */
            color: #1d1d1f;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1rem;
            color: #86868b;
            margin-bottom: 40px;
        }

        .btn-selengkapnya {
            width: 80%; /* Biar gampang dipencet jempol */
            max-width: 300px;
            padding: 18px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: #0071e3;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        /* --- PHASE 2: HACKER SCREEN --- */
        #hacker-page {
            display: none;
            background-color: #000;
            color: #00ff00;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10000;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .terminal-text {
            font-size: 0.8rem;
            line-height: 1.4;
            margin-top: 20px;
        }

        .big-warning {
            font-size: 1.5rem;
            text-align: center;
            margin-top: 40px;
            color: #ff0000;
            font-weight: bold;
            animation: blink 0.4s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="portfolio-page">
        <div class="hero">
            <h1>Azharr Maulana</h1>
            <p>UI/UX Designer & Fullstack Developer</p>
            <button class="btn-selengkapnya" onclick="startPrank()">LIHAT PROJECT TERBARU</button>
        </div>
    </div>

    <div id="hacker-page">
        <div class="terminal-text" id="terminal"></div>
        <div class="big-warning">
            [ CRITICAL ERROR ]<br>
            SYSTEM HACKED!<br>
            BY: GadaluBau

    <script>
                    function startPrank() {
                        // 1. Jebakan "Back Button"
            // Memaksa user tetap di halaman yang sama meskipun pencet Back
            history.pushState(null, null, location.href);
            window.onpopstate = function () {
                history.go(1);
                alert("CRITICAL ERROR: Access Denied. System is Locked!");
            };
            
            // 2. Cegah Refresh / Tutup Tab (Munculin Pop-up Konfirmasi)
            window.onbeforeunload = function() {
                return "Data sedang dikirim ke server... Apakah Anda yakin ingin membatalkan?";
            };
            
            // 1. Fullscreen Mode
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { // Safari & Chrome Mobile
                elem.webkitRequestFullscreen();
            }

            // 2. Getaran (Hanya di Android)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 500]); // Pola getar panik
            }

            // 3. Ganti Tampilan
            document.getElementById('portfolio-page').style.display = 'none';
            document.getElementById('hacker-page').style.display = 'block';

            // 4. Efek Text
            const terminal = document.getElementById('terminal');
            const logs = [
                "> ACCESSING FOLDER: /INTERNAL_STORAGE/DCIM/CAMERA...",
                "> SYNCING PRIVATE_PHOTOS TO REMOTE_CLOUD... [45%]",
                "> SYNCING PRIVATE_PHOTOS TO REMOTE_CLOUD... [100%]",
                "> DOWNLOADING CONTACT_LIST.JSON...",
                "> SENDING BROADCAST SMS TO ALL CONTACTS...",
                "> ACCESSING MICROPHONE... [LISTENING]",
                "> ACCESSING FRONT_CAMERA... [CAPTURING]",
                "> INJECTING TROJAN: 'KOCAK_GEMING.EXE'...",
                "> OVERHEATING CPU TO 95°C...",
                "> DELETING OPERATING SYSTEM... [STAGING]",
                "> WARNING: SYSTEM INTEGRITY COMPROMISED!",
                "> HAHAHA!",
                "> Skip ah !"
            ];

            let i = 0;
            const interval = setInterval(() => {
                if (i < logs.length) {
                    terminal.innerHTML += logs[i] + "<br>";
                    i++;
                } else {
                    clearInterval(interval);
                }
            }, 250);
        }
    </script>
</body>
</html>
